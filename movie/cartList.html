<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Insert title here</title>
<link  rel="stylesheet" type="text/css" href="css/basic.css"  />
<style type="text/css">
.poster {
	width : 150px;
	height : 150px;
	
}

a{text-decoration: none}
</style>



<script type="text/javascript">
  onload = () => {
	// localStorage에 있는 정보 조회하기
    function getInfo() {
      let len = localStorage.length;
	  let tbody = document.querySelector('#content');
	  tbody.innerHTML = '';

      for (let i = 0; i < len; i++) {
        let key = localStorage.key(i);
        let value = localStorage.getItem(key);

		// 행 추가
		let tr = tbody.insertRow();

		// id="1001" data-info="쿵푸팬더,img/movie_image2.jpg,3000"
		// 첫 번째 셀
		let td1 = tr.insertCell();
		let input1 = document.createElement('img');
		input1.className = 'poster';
		input1.src = value.split(',')[1];
		td1.appendChild(input1);

		// 두 번째 셀
		let td2 = tr.insertCell();
		td2.textContent = key;

		// 세 번째 셀
		let td3 = tr.insertCell();
		td3.textContent = value.split(',')[0]

		// 네 번째 셀
		let td4 = tr.insertCell();
		td4.textContent = value.split(',')[2]


		// 다섯 번째 셀
		let td5 = tr.insertCell();
		let button = document.createElement('button');
		button.value = '삭제';
		button.textContent = '삭제';
		td5.appendChild(button);
		console.log(button);
      }
    }
  
    // 페이지 로딩 시 조회
    getInfo();

	document.body.addEventListener('click', () => {
	if(event.target.matches('[value=삭제]')){
		let findKey = event.target.parentElement.previousElementSibling.previousElementSibling.previousElementSibling.textContent;
		localStorage.removeItem(findKey);
		getInfo();
	}
  });
  }
  
</script>
</head>
<body>
<button name="delItem">삭제</button>
<hr>
		<article class="main">
		<section>
			<table width="80%"  align="center"  >
			<caption class="caption">찜 리스트</caption>
			<thead>
				<tr><th>이미지</th><th>상품번호</th><th>상품이름</th><th>가격</th><th>삭제</th></tr>
			</thead>
			<tbody id="content">
			   <!-- 찜목록 출력 -->
			    
			</tbody>
			</table>
		</section>
		<section  class="toalprice" id="price">
			<!-- 가격 -->
		</section>
		<section class="link">
			<table   align="center">
			<tr><td align="center">
				<a href="">주문하러 가기</a> 
				<a href="index.html">DVD LIST</a> 
			</td></tr>
			</table>
		</section>
		</article>
</body>
</html>
